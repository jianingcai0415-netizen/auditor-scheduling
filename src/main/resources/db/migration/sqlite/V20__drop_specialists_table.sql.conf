# Script configuration for V20__drop_specialists_table.sql (Flyway reads it from this
# sibling file -- since Flyway 12 the in-script comment form is no longer used).
#
# PRAGMA foreign_keys has no effect inside a transaction: SQLite silently ignores it when
# one is pending. Flyway wraps every migration in a transaction by default, so without this
# the PRAGMA would be a no-op and DROP TABLE locations would fail with
# "FOREIGN KEY constraint failed" (the table's implicit DELETE hits the six child tables).
#
# Leaving the PRAGMA in place while keeping the default would be worse than an error: Flyway
# classifies PRAGMA as non-transactional and CREATE TABLE as transactional, so it refuses the
# mix outright with "Detected both transactional and non-transactional statements within the
# same migration (even though mixed is false)" -- which is how this file came to exist.
#
# The price is that this migration is not atomic. The exposure is two statements, and the
# data is already copied into locations_new before locations is dropped, so an interruption
# leaves the rows recoverable and the migration marked as failed, which stops the
# application from starting on an inconsistent schema.
executeInTransaction=false
